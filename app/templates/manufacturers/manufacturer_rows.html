{% for manufacturer in manufacturers %}
<tr id="manufacturer-row-{{ manufacturer.id }}">
  <td>
    <a href="/manufacturers/{{ manufacturer.id }}"
      style="color:var(--text-primary);text-decoration:none;font-weight:500;">
      {{ manufacturer.name }}
    </a>
  </td>
  <td>
    {% if manufacturer.is_active %}
    <span class="badge badge-success">Active</span>
    {% else %}
    <span class="badge badge-ghost">Inactive</span>
    {% endif %}
  </td>
  <td style="color:var(--text-secondary);">{{ manufacturer.created_at | fmt_date }}</td>
  <td>
    <div style="display:flex;gap:6px;">
      <a href="/manufacturers/{{ manufacturer.id }}" class="btn btn-sm btn-secondary btn-icon" data-tooltip="View">
        <i class="fa-solid fa-eye"></i>
      </a>
      <a hx-get="/manufacturers/{{ manufacturer.id }}/edit" class="btn btn-sm btn-secondary btn-icon" data-tooltip="Edit">
        <i class="fa-solid fa-pen"></i>
      </a>
      <button type="button" class="btn btn-sm btn-secondary btn-icon"
        data-tooltip="{{ 'Deactivate' if manufacturer.is_active else 'Activate' }}"
        hx-post="/manufacturers/{{ manufacturer.id }}/{{ 'deactivate' if manufacturer.is_active else 'activate' }}"
        hx-target="closest tr" hx-swap="outerHTML">
        <i class="fa-solid fa-{{ 'toggle-off' if manufacturer.is_active else 'toggle-on' }}"></i>
      </button>
      <button class="btn btn-sm btn-danger btn-icon" data-tooltip="Delete" hx-delete="/manufacturers/{{ manufacturer.id }}"
        hx-confirm="Delete {{ manufacturer.name }}?" hx-target="closest tr" hx-swap="delete">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  </td>
</tr>
{% endfor %}

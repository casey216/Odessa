{% extends "base.html" %}
{% block title %}Users — FleetMS{% endblock %}

{% block breadcrumb %}
<div class="breadcrumb">
  <span class="current"><i class="fa-solid fa-users" style="margin-right:6px"></i>Users</span>
</div>
{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Users</h1>
    <p class="page-subtitle">{{ pagination["total"] }} user{{ 's' if pagination["total"] != 1 }} registered</p>
  </div>
  <a href="/users/new" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Add User</a>
</div>

<!-- Filters -->
<form id="user-filters" class="filters-bar" hx-get="/users" hx-target="#user-list-content"
  hx-trigger="change from:select, keyup changed delay:300ms from:input">
  <div class="search-wrapper">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" class="search-input" placeholder="Search name or email…" name="search" value="{{ search or '' }}">
  </div>
  <select name="role" style="max-width: 220px;" class="form-select">
    <option value="">All Roles</option>
    {% for r in roles %}
    <option value="{{ r }}" {% if role_filter == r %} selected {% endif %}>{{ r.replace('_', ' ').title() }}</option>
    {% endfor %}
  </select>
</form>
<div id="user-list-content">
  {% include "users/user_list_content.html" %}
</div>

{% endblock %}

{% extends "standalone_base.html" %}

{% block title %}Sign In — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="fa-solid fa-truck-fast"></i></div>
      <div class="auth-logo-text">{{ app_name }}</div>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to manage your fleet</p>

    {% if error %}
    <div class="flash flash-error" style="margin: 0 0 20px;">
      <i class="fa-solid fa-circle-exclamation"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/auth/login">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-input" placeholder="you@company.com" value="{{ email or '' }}"
          required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required
          autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary"
        style="width: 100%; justify-content: center; padding: 10px 16px; font-size: 14px;">
        <i class="fa-solid fa-right-to-bracket"></i>
        Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}
